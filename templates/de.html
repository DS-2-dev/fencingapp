{% extends "base.html" %}
{% block content %}

  <!-- DE sub-bar: Connect Device | Print | Save -->
  <div class="de-bar">
    <button class="frutiger-aero-button connect-device-btn" type="button">Connect Device</button>
    <button class="frutiger-aero-button print-btn">Print</button>
    <button class="frutiger-aero-button save-btn">Save</button>
  </div>

  <!-- Your clipboard-style layout goes here -->
  <link rel="stylesheet" href="{{ url_for('static', filename='checkin.css') }}">

  <!-- DE bracket stack: reuse fencer card styles from checkin -->
  <div id="de-cards-stack" class="de-cards-stack" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='de.js') }}"></script>
{% endblock %}
