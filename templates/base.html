<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='nav-style.css') }}">
</head>
<body>
  

  <!-- Glass Menu Bar -->
  <div class="glass-menu-bar">
    <div class="top-row">
      <div class="main-buttons">
        <a href="/" class="nav-btn frutiger-aero-button home-btn">Home</a>
        <a href="/summary" class="nav-btn frutiger-aero-button summary-btn">Summary</a>
        <a href="/checkin" class="nav-btn frutiger-aero-button checkin-btn">Check-in</a>
        <a href="/seeding" class="nav-btn frutiger-aero-button seeding-btn">Seeding</a>
        <a href="/pools" class="nav-btn frutiger-aero-button pools-btn">Pools</a>
        <a href="/de" class="nav-btn frutiger-aero-button de-btn">DE</a>
        <a href="/results" class="nav-btn frutiger-aero-button results-btn">Results</a>
      </div>

      <!-- Middle group: Events + Display Mode -->
      <div class="middle-buttons">
        <a href="/events" class="nav-btn frutiger-aero-button events-btn"><span class="events-label">Events</span></a>
        <a href="#" class="nav-btn frutiger-aero-button display-mode-btn" role="button" aria-label="Display Mode">Display Mode</a>
      </div>

      <!-- Right side: +/- buttons -->
      <div class="right-buttons">
        <a href="/add-fencer" class="nav-btn frutiger-aero-button add-fencer-btn">+</a>
        <a href="#" class="nav-btn frutiger-aero-button events-btn remove-copy-btn" role="button" aria-label="Remove">-</a>
      </div>
    </div>
  </div>

  <!-- Page Content -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='nav-active.js') }}"></script>
  <script>
    (function(){
      try {
        const labelEl = document.querySelector('.events-btn .events-label');
        if (!labelEl) return;

        // Compose label from saved summary data (if present)
        const saved = sessionStorage.getItem('fencingapp:summary-data');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            const evt = data.event || {};
            const parts = [];

            const sanitize = v => {
              if (v === null || v === undefined) return null;
              const s = String(v).trim();
              if (!s) return null;
              const low = s.toLowerCase();
              if (low === 'none' || low === 'n/a' || low === 'null' || low === 'undefined') return null;
              return s;
            };

            const rating = sanitize(evt.rating_limit);
            const age = sanitize(evt.age_limit);
            let gender = sanitize(evt.gender_mixed);
            const weapon = sanitize(evt.weapon);

            if (rating) parts.push(rating);
            if (age) parts.push(age);
            if (gender) {
              const gm = gender.toLowerCase();
              if (gm === 'yes' || gm === 'true' || gm === 'mixed') {
                parts.push('Mixed');
              } else {
                parts.push(gender.charAt(0).toUpperCase() + gender.slice(1));
              }
            }
            if (weapon) parts.push(weapon);

            if (parts.length) {
              labelEl.textContent = parts.join(' ');
            }
          } catch (e) { /* ignore parse errors */ }
        }

        // Ensure the visible width matches the width of "Mixed Saber" so
        // longer labels will be truncated with an ellipsis.
        try {
          const meas = document.createElement('span');
          meas.className = 'events-label';
          meas.style.position = 'absolute';
          meas.style.visibility = 'hidden';
          meas.style.whiteSpace = 'nowrap';
          meas.textContent = 'Mixed Saber';
          document.body.appendChild(meas);
          const targetW = Math.ceil(meas.getBoundingClientRect().width);
          document.body.removeChild(meas);
          // apply as inline max-width so it overrides stylesheet default
          labelEl.style.maxWidth = targetW + 'px';
        } catch (e) { /* ignore measurement errors */ }

        // If no label was set from data, default to "Mixed Saber"
        if (!labelEl.textContent || !labelEl.textContent.trim()) {
          labelEl.textContent = 'Mixed Saber';
        }
      } catch (e) { console.error('Failed to set events label', e); }
    })();
  </script>
</body>
</html>
